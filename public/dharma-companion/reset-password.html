<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dharma Companion - Reset Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      color: #7f1d1d;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top: 4px solid #7f1d1d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .manual-link {
      display: inline-block;
      background: #7f1d1d;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .manual-link:hover {
      background: #991b1b;
    }
    .error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🪷</div>
    <h1>Opening Dharma Companion...</h1>
    <p>Redirecting you to the app to reset your password.</p>
    <div class="spinner"></div>
    <p class="error" id="error" style="display: none;">
      App not installed?
      <a href="https://apps.apple.com/app/dharma-companion" style="color: #7f1d1d;">Download from App Store</a>
    </p>
    <a href="#" id="manual-link" class="manual-link" style="display: none;">
      Open App Manually
    </a>
  </div>

  <script>
    // Extract token and type from URL hash (Supabase format: #access_token=...&type=recovery)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type');

    // Build deep link with all necessary parameters
    let deepLink = 'dharma-companion://reset-password';
    if (accessToken && type === 'recovery') {
      deepLink += `?access_token=${encodeURIComponent(accessToken)}`;
      if (refreshToken) {
        deepLink += `&refresh_token=${encodeURIComponent(refreshToken)}`;
      }
      deepLink += `&type=${encodeURIComponent(type)}`;
    }

    // Attempt to open the app
    function openApp() {
      window.location.href = deepLink;
    }

    // Try to open immediately
    openApp();

    // Show manual link after 3 seconds if still on page
    setTimeout(() => {
      document.getElementById('error').style.display = 'block';
      const manualLink = document.getElementById('manual-link');
      manualLink.href = deepLink;
      manualLink.style.display = 'inline-block';
    }, 3000);
  </script>
</body>
</html>
