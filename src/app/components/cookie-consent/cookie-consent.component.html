<div class="cookie-banner" *ngIf="showBanner">
  <div class="cookie-content">
    <div class="cookie-text">
      <p>We use cookies to enhance your experience on our website. By continuing to use our site, you consent to our use of cookies in accordance with our <a [routerLink]="['/privacy']">Privacy Policy</a>.</p>
    </div>
    <div class="cookie-buttons">
      <button class="btn btn-secondary" (click)="rejectCookies()">Reject Non-Essential</button>
      <button class="btn btn-primary" (click)="acceptAllCookies()">Accept All</button>
    </div>
  </div>
</div>
