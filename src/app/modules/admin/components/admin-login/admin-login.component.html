<div class="container">
  <div class="mt-5">
    <div class="col-md-6 col-lg-12 ">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center py-3">
          <h2 class="mb-0">Admin Panel</h2>
        </div>
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <div class="logo-wrapper">
              <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
            </div>
            <h4 class="mt-3">Admin Login</h4>
            <p class="text-muted">Enter your credentials to access the admin dashboard</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input
                  type="text"
                  id="username"
                  formControlName="username"
                  class="form-control"
                  placeholder="Enter username"
                  [ngClass]="{'is-invalid': usernameControl.invalid && (usernameControl.dirty || usernameControl.touched)}"
                >
              </div>
              <div *ngIf="usernameControl.invalid && (usernameControl.dirty || usernameControl.touched)" class="invalid-feedback d-block">
                <div *ngIf="usernameControl.errors?.['required']">Username is required</div>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  id="password"
                  formControlName="password"
                  class="form-control"
                  placeholder="Enter password"
                  [ngClass]="{'is-invalid': passwordControl.invalid && (passwordControl.dirty || passwordControl.touched)}"
                >
              </div>
              <div *ngIf="passwordControl.invalid && (passwordControl.dirty || passwordControl.touched)" class="invalid-feedback d-block">
                <div *ngIf="passwordControl.errors?.['required']">Password is required</div>
                <div *ngIf="passwordControl.errors?.['minlength']">Password must be at least 6 characters</div>
              </div>
            </div>

            <div *ngIf="loginError" class="alert alert-danger" role="alert">
              {{ loginError }}
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2"
              [disabled]="loginForm.invalid || isLoading"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Log in
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
